          list-mode: lax
          allow:
            - github.com/Hayao0819/hytop/internal/collect/filesystem$
            - github.com/Hayao0819/hytop/internal/collect$
            - github.com/Hayao0819/hytop/internal/collect/sysread$
            - github.com/Hayao0819/hytop/internal/domain
            - github.com/Hayao0819/hytop/internal/errors$
          deny: *deny_internal

        sysread-tests:
          files: ["**/internal/collect/sysread/*_test.go"]
          list-mode: lax
          allow: ["github.com/Hayao0819/hytop/internal/collect/sysread$"]
          deny: *deny_internal

        store-tests:
          files: ["**/internal/store/*_test.go"]
          list-mode: lax
          allow:
            - github.com/Hayao0819/hytop/internal/store$
            - github.com/Hayao0819/hytop/internal/domain
          deny: *deny_internal

        chart-tests:
