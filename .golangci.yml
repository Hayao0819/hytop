          deny: *deny_internal

        page-tests:
          files: ["**/internal/ui/page/*_test.go"]
          list-mode: lax
          allow:
            - github.com/Hayao0819/hytop/internal/conf$
            - github.com/Hayao0819/hytop/internal/domain
            - github.com/Hayao0819/hytop/internal/errors$
            - github.com/Hayao0819/hytop/internal/store$
