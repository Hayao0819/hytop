        app-tests:
          files: ["**/internal/app/*_test.go"]
          list-mode: lax
          allow:
            - github.com/Hayao0819/hytop/internal/app$
            - github.com/Hayao0819/hytop/internal/collect$
            - github.com/Hayao0819/hytop/internal/conf$
